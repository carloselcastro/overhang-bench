# PrusaSlicer profile used as the reference slicer for overhang-bench.
# Generic 0.4 mm nozzle / 0.20 mm layers / PLA 1.75 mm, supports everywhere.
# Keep this file under version control: every number in the paper's tables must
# be traceable to it.
printer_technology = FFF
gcode_flavor = marlin2
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
nozzle_diameter = 0.4
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
support_material = 1
support_material_auto = 1
support_material_buildplate_only = 0
# slope threshold from the horizontal plane; 45 = the usual "45 degree rule"
support_material_threshold = 45
support_material_style = grid
support_material_pattern = rectilinear
support_material_spacing = 2
support_material_contact_distance = 0.2
support_material_interface_layers = 2
dont_support_bridges = 0
filament_diameter = 1.75
filament_density = 1.24
filament_type = PLA
temperature = 215
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
skirts = 0
brim_width = 0
complete_objects = 0
